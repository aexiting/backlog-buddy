# amplify.yml – root‑centric
version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - npm ci
        - npm ci --prefix apps/web
    build:
      commands:
        - npm run build --prefix apps/web
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/web/node_modules/**/*
