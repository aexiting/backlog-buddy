# amplify.yml – root‑centric
version: 1
image: mcr.microsoft.com/playwright:v1.45.0-jammy

frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - npm ci
        - |
          yum install -y \
          libicu69 libicu69-devel \
          libatomic \
          libjpeg-turbo libjpeg-turbo-devel \
          libwebp libwebp-devel \
          enchant2 enchant2-devel \
          hyphen hyphen-devel \
          libffi libffi-devel \
          libevdev libevdev-devel \
          x264-libs \
          woff2 \
          woff2-devel
        - npx playwright install
    build:
      commands:
        - npm run build --workspace=apps/web
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/web/node_modules/**/*
      - ~/.cache/ms-playwright

test:
  phases:
    test:
      commands:
        - npx playwright install
        - npx playwright test --reporter=html,line --output=playwright-report
  artifacts:
    baseDirectory: playwright-report
    files:
      - '**/*'
  cache:
    paths:
      - ~/.cache/ms-playwright