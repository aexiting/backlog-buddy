# amplify.yml – root‑centric
version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci

        - npm ci --prefix apps/web

        - npx playwright install --with-deps
    build:
      commands:
        - npm run build --prefix apps/web
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/web/node_modules/**/*
      - ~/.cache/ms-playwright   # speeds subsequent builds

test:
  phases:
    test:
      commands:
        - npx playwright install --with-deps
        - npx playwright test --reporter=html,line --output=playwright-report
  artifacts:
    baseDirectory: playwright-report
    files:
      - '**/*'
  cache:
    paths:
      - ~/.cache/ms-playwright