version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd apps/web
        - npm ci
        - npx playwright install --with-deps
    build:
      commands:
        - cd apps/web
        - npm run build
        - npm run test:e2e
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - apps/web/node_modules/**/*